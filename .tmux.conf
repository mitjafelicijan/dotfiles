unbind C-b
set -g prefix `
bind ` send-prefix

set -g default-terminal "screen-256color"
set-window-option -g automatic-rename on
set-window-option -g mode-keys vi
set-option -g set-titles on
set-option -sg escape-time 10
set-option -g mouse off

set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000
set -g focus-events on
set -g allow-passthrough on

set -g window-style 'bg=black'
set -g window-active-style 'bg=black'
set -g popup-style 'bg=black'
set -g popup-border-style 'bg=black'
set -g status-style 'fg=white,bg=#222222'
set -g window-status-current-style 'none'
set -g window-status-current-format '#[fg=black,bg=#bbbbbb] #I:#W '

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -i --clipboard"
bind p run "xsel -o --clipboard | tmux load-buffer - ; tmux paste-buffer"

bind-key Up    select-pane -U
bind-key Down  select-pane -D
bind-key Left  select-pane -L
bind-key Right select-pane -R

bind-key -r S-Up    resize-pane -U 5
bind-key -r S-Down  resize-pane -D 5
bind-key -r S-Left  resize-pane -L 5
bind-key -r S-Right resize-pane -R 5

bind s display-popup -d '#{pane_current_path}' -w 80% -h 80% -E bash
bind g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E lazygit
bind h display-popup -d '#{pane_current_path}' -w 80% -h 80% -E htop
bind m display-popup -d '#{pane_current_path}' -w 80% -h 80% -E mc

# Reload config shortcut
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
